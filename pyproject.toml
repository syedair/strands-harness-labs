[project]
name = "strands-harness-labs"
version = "0.1.0"
description = "Hands-on labs for the Strands Harness SDK and System 1 classifiers"
requires-python = ">=3.13"
dependencies = [
    "strands-harness[ollama]>=0.1.2,<0.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typesafe-sdk>=0.7.1,<0.8",  # Jev and Kev (labs 6a, 6b)
]

[project.optional-dependencies]
laya = ["laya>=0.3.20"]  # lab 10 only; pulls in PyTorch
web = ["fastapi>=0.141", "uvicorn>=0.54"]  # lab 11 only

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["labs"]
