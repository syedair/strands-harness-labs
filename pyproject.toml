[project]
name = "strands-harness-labs"
version = "0.1.0"
description = "Hands-on labs for the Strands Harness SDK and System 1 classifiers"
requires-python = ">=3.13"
dependencies = [
    "strands-harness[ollama]>=0.1.2,<0.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["labs"]
